name: GHCR Lifecycle Management

# Manages container image lifecycle in GitHub Container Registry (ghcr.io).
# Similar to AWS ECR lifecycle policies - prunes old images while keeping
# a minimum number of recent versions.
#
# Example (scheduled cleanup):
#   on:
#     schedule:
#       - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
#     workflow_dispatch:      # Allow manual runs
#
#   jobs:
#     cleanup:
#       uses: zostay/build/.github/workflows/ghcr-lifecycle.yaml@master
#       with:
#         package-name: 'myapp'
#         min-versions-to-keep: 10
#         delete-after-days: 30
#       secrets:
#         GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
#
# Example (per-environment lifecycle with tag prefixes):
#   jobs:
#     cleanup:
#       uses: zostay/build/.github/workflows/ghcr-lifecycle.yaml@master
#       with:
#         package-name: 'myapp'
#         tag-prefixes: 'prod-,stg-'
#         min-versions-to-keep: 10
#         delete-after-days: 7
#       secrets:
#         GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
#
# Note: The GHCR_TOKEN must be a PAT with read:packages and delete:packages
# scopes, or use GITHUB_TOKEN if the workflow has packages: write permission.

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Name of the container package to manage (e.g., "myapp" or "repo/myapp")'
        required: true
        type: string
      package-owner:
        description: 'Owner of the package (user or org). Defaults to repository owner.'
        required: false
        type: string
        default: ''
      min-versions-to-keep:
        description: 'Minimum number of versions to keep regardless of age (per tag prefix group if tag-prefixes is set)'
        required: false
        type: number
        default: 10
      delete-after-days:
        description: 'Versions older than this many days are eligible for deletion (after min-versions-to-keep is satisfied)'
        required: false
        type: number
        default: 30
      tag-prefixes:
        description: 'Comma-separated list of tag prefixes to manage independently (e.g., "prod-,stg-"). Each prefix group gets its own min-versions-to-keep quota.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'If true, only report what would be deleted without actually deleting'
        required: false
        type: boolean
        default: false
      include-untagged:
        description: 'If true, include untagged versions in cleanup (recommended)'
        required: false
        type: boolean
        default: true
      protected-tags:
        description: 'Comma-separated list of tag patterns to never delete (e.g., "latest,v*,prod-*")'
        required: false
        type: string
        default: 'latest'
    secrets:
      GHCR_TOKEN:
        description: 'GitHub token with packages read/delete permissions (PAT or GITHUB_TOKEN)'
        required: true
    outputs:
      deleted-count:
        description: 'Number of versions deleted'
        value: ${{ jobs.cleanup.outputs.deleted-count }}
      kept-count:
        description: 'Number of versions kept'
        value: ${{ jobs.cleanup.outputs.kept-count }}
      dry-run-would-delete:
        description: 'Number of versions that would be deleted (dry-run only)'
        value: ${{ jobs.cleanup.outputs.dry-run-would-delete }}

jobs:
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    outputs:
      deleted-count: ${{ steps.cleanup.outputs.deleted-count }}
      kept-count: ${{ steps.cleanup.outputs.kept-count }}
      dry-run-would-delete: ${{ steps.cleanup.outputs.dry-run-would-delete }}
    steps:
      - name: Cleanup Container Versions
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_OWNER: ${{ inputs.package-owner || github.repository_owner }}
          MIN_VERSIONS: ${{ inputs.min-versions-to-keep }}
          DELETE_AFTER_DAYS: ${{ inputs.delete-after-days }}
          TAG_PREFIXES: ${{ inputs.tag-prefixes }}
          DRY_RUN: ${{ inputs.dry-run }}
          INCLUDE_UNTAGGED: ${{ inputs.include-untagged }}
          PROTECTED_TAGS: ${{ inputs.protected-tags }}
        run: |
          set -euo pipefail

          # Initialize summary file
          SUMMARY_FILE=$(mktemp)
          WORK_DIR=$(mktemp -d)
          REFERENCED_DIGESTS_FILE="$WORK_DIR/referenced"
          trap 'rm -f "$SUMMARY_FILE"; rm -rf "$WORK_DIR"' EXIT

          # URL-encode the package name (handle slashes in names like "repo/image")
          PACKAGE_NAME_ENCODED=$(printf '%s' "$PACKAGE_NAME" | jq -sRr @uri)

          echo "=== GHCR Lifecycle Management ==="
          echo "Package: $PACKAGE_OWNER/$PACKAGE_NAME"
          echo "Min versions to keep: $MIN_VERSIONS"
          echo "Delete after (days): $DELETE_AFTER_DAYS"
          echo "Tag prefixes: ${TAG_PREFIXES:-<none - global policy>}"
          echo "Dry run: $DRY_RUN"
          echo "Include untagged: $INCLUDE_UNTAGGED"
          echo "Protected tags: $PROTECTED_TAGS"
          echo

          # Start building summary
          {
            echo "## GHCR Lifecycle: $PACKAGE_OWNER/$PACKAGE_NAME"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Min versions to keep | $MIN_VERSIONS |"
            echo "| Delete after (days) | $DELETE_AFTER_DAYS |"
            echo "| Tag prefixes | ${TAG_PREFIXES:-*(global policy)*} |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Include untagged | $INCLUDE_UNTAGGED |"
            echo "| Protected tags | $PROTECTED_TAGS |"
            echo ""
          } >> "$SUMMARY_FILE"

          # Calculate cutoff timestamp (seconds since epoch)
          CUTOFF_EPOCH=$(date -u -d "$DELETE_AFTER_DAYS days ago" +%s)
          CUTOFF_DATE=$(date -u -d "@$CUTOFF_EPOCH" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date: $CUTOFF_DATE"
          echo ""

          # Determine if owner is a user or org
          OWNER_TYPE=$(gh api "users/$PACKAGE_OWNER" --jq '.type' 2>/dev/null || echo "Organization")

          if [ "$OWNER_TYPE" = "User" ]; then
            API_PATH="users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME_ENCODED/versions"
          else
            API_PATH="orgs/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME_ENCODED/versions"
          fi

          echo "Owner type: $OWNER_TYPE"
          echo "Using API path: $API_PATH"
          echo ""

          # Fetch all versions (paginated)
          # Note: --paginate with --jq processes each page separately, so we need to
          # collect all pages first, then combine and process them
          echo "Fetching package versions..."
          RAW_VERSIONS=$(gh api --paginate "$API_PATH" 2>&1) || {
            echo "Error: Failed to fetch package versions"
            echo "$RAW_VERSIONS"
            echo ""
            echo "### ❌ Error" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "Failed to fetch package versions from API." >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo '```' >> "$SUMMARY_FILE"
            echo "$RAW_VERSIONS" >> "$SUMMARY_FILE"
            echo '```' >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # Combine paginated results (each page is a JSON array) and extract needed fields
          VERSIONS_JSON=$(echo "$RAW_VERSIONS" | jq -s '
            [.[][] | {id: .id, name: .name, created_at: .created_at, tags: (.metadata.container.tags // [])}]
            | sort_by(.created_at) | reverse
          ') || {
            echo "Error: Failed to parse package versions"
            echo "Raw response:"
            echo "$RAW_VERSIONS"
            echo ""
            echo "### ❌ Error" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "Failed to parse package versions JSON." >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          TOTAL_VERSIONS=$(echo "$VERSIONS_JSON" | jq 'length')

          if [ "$TOTAL_VERSIONS" -eq 0 ]; then
            echo "No versions found for package $PACKAGE_NAME"
            echo "deleted-count=0" >> "$GITHUB_OUTPUT"
            echo "kept-count=0" >> "$GITHUB_OUTPUT"
            echo "dry-run-would-delete=0" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ No versions found" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "No container versions found for this package." >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Total versions found: $TOTAL_VERSIONS"
          echo ""

          # Build protected tag regex from glob patterns
          build_regex() {
            local patterns="$1"
            if [ -z "$patterns" ]; then
              echo ""
              return
            fi
            echo "$patterns" | tr ',' '\n' | while read -r pattern; do
              pattern=$(echo "$pattern" | xargs)  # trim whitespace
              [ -z "$pattern" ] && continue
              # Escape regex special chars, then convert globs
              echo "$pattern" | sed 's/[.^$+?{}|()\\[\\]]/\\&/g; s/\*/.*/g'
            done | paste -sd '|' -
          }

          PROTECTED_REGEX=$(build_regex "$PROTECTED_TAGS")
          if [ -n "$PROTECTED_REGEX" ]; then
            echo "Protected tag regex: ^($PROTECTED_REGEX)$"
            echo ""
          fi

          # Build tag prefixes JSON array
          if [ -n "$TAG_PREFIXES" ]; then
            TAG_PREFIXES_JSON=$(echo "$TAG_PREFIXES" | tr ',' '\n' | while read -r prefix; do
              prefix=$(echo "$prefix" | xargs)  # trim whitespace
              [ -z "$prefix" ] && continue
              echo "\"$prefix\""
            done | paste -sd ',' - | sed 's/^/[/; s/$/]/')
            echo "Tag prefix groups: $TAG_PREFIXES_JSON"
            echo ""
          else
            TAG_PREFIXES_JSON="[]"
          fi

          # Process versions using jq to handle the logic
          # When tag-prefixes is set, each prefix group gets its own min-versions quota
          RESULTS=$(echo "$VERSIONS_JSON" | jq --arg cutoff "$CUTOFF_EPOCH" \
            --arg min_versions "$MIN_VERSIONS" \
            --arg include_untagged "$INCLUDE_UNTAGGED" \
            --arg protected_regex "$PROTECTED_REGEX" \
            --argjson tag_prefixes "$TAG_PREFIXES_JSON" '
            def is_protected($tags; $regex):
              if $regex == "" then false
              elif ($tags | length) == 0 then false
              else ($tags | any(. as $tag | $tag | test("^(" + $regex + ")$")))
              end;

            def is_old($created_at; $cutoff):
              ($created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < ($cutoff | tonumber);

            # Find which prefix group a version belongs to (based on its tags)
            # Returns the first matching prefix, or "untagged" for untagged, or "other" for no match
            def get_prefix_group($tags; $prefixes):
              if ($tags | length) == 0 then "untagged"
              elif ($prefixes | length) == 0 then "all"
              else
                ($prefixes | map(. as $p | if ($tags | any(startswith($p))) then $p else null end) | map(select(. != null)) | first) // "other"
              end;

            # Initialize counters per prefix group
            (if ($tag_prefixes | length) > 0 then
              ($tag_prefixes + ["untagged", "other"]) | map({key: ., value: 0}) | from_entries
            else
              {"all": 0}
            end) as $initial_counts |

            reduce .[] as $v (
              {kept_counts: $initial_counts, protected: 0, to_delete: [], to_keep: []};

              ($v.tags | length) as $tag_count |
              ($tag_count == 0) as $is_untagged |
              is_protected($v.tags; $protected_regex) as $is_protected |
              is_old($v.created_at; $cutoff) as $is_old |
              get_prefix_group($v.tags; $tag_prefixes) as $prefix_group |

              if $is_protected then
                .protected += 1 |
                .to_keep += [{id: $v.id, name: $v.name, tags: $v.tags, reason: "protected", group: $prefix_group}]
              elif $is_untagged and ($include_untagged != "true") then
                .kept_counts[$prefix_group] += 1 |
                .to_keep += [{id: $v.id, name: $v.name, tags: $v.tags, reason: "untagged-excluded", group: $prefix_group}]
              elif .kept_counts[$prefix_group] < ($min_versions | tonumber) then
                .kept_counts[$prefix_group] += 1 |
                .to_keep += [{id: $v.id, name: $v.name, tags: $v.tags, reason: ("min-versions (" + $prefix_group + ": " + ((.kept_counts[$prefix_group]) | tostring) + "/" + $min_versions + ")"), group: $prefix_group}]
              elif $is_old | not then
                .kept_counts[$prefix_group] += 1 |
                .to_keep += [{id: $v.id, name: $v.name, tags: $v.tags, reason: "not-old-enough", group: $prefix_group}]
              else
                .to_delete += [{id: $v.id, name: $v.name, tags: $v.tags, created_at: $v.created_at, group: $prefix_group}]
              end
            ) |
            # Add total kept count
            .kept = ([.kept_counts[]] | add)
          ') || {
            echo "Error: Failed to process versions"
            echo "### ❌ Error" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "Failed to process package versions." >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # ---------------------------------------------------------------
          # Protect every manifest that a surviving version depends on.
          #
          # A multi-arch image is an index that carries the tag and refers to
          # untagged per-platform child manifests by digest; buildx
          # attestation and SBOM manifests hang off the same index as
          # "unknown/unknown" entries. GHCR lists every one of them as a
          # package "version", and the children carry no tags, so the
          # retention maths above sees them as ordinary untagged versions and
          # will happily delete a child while keeping the index that points
          # at it. The tag still resolves afterwards; every pull of it fails
          # with NotFound.
          #
          # So, after all quota maths and overriding it unconditionally:
          # resolve every version this run intends to keep, collect the
          # digests it references, and pull those back out of the deletion
          # list. Repeat until the set stops growing, because a rescued
          # manifest can reference further manifests of its own.
          #
          # This step is fail-closed. If a kept manifest cannot be resolved
          # then what it depends on is unknown, and deleting on that guess is
          # exactly what hollowed out the registry before. Abort instead: an
          # unpruned package costs storage, a missing child costs an outage.
          # ---------------------------------------------------------------
          REGISTRY_OWNER=$(printf '%s' "$PACKAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          REGISTRY_NAME=$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')
          REGISTRY_REPO="$REGISTRY_OWNER/$REGISTRY_NAME"
          REGISTRY_ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.v1+prettyjws,application/json"

          registry_get() {
            curl -sf \
                 -H "Authorization: Bearer $REGISTRY_TOKEN" \
                 -H "Accept: $REGISTRY_ACCEPT" \
                 "https://ghcr.io/v2/$REGISTRY_REPO/manifests/$1" 2>/dev/null
          }

          registry_exists() {
            curl -sfI -o /dev/null \
                 -H "Authorization: Bearer $REGISTRY_TOKEN" \
                 -H "Accept: $REGISTRY_ACCEPT" \
                 "https://ghcr.io/v2/$REGISTRY_REPO/manifests/$1" 2>/dev/null
          }

          registry_probe() {
            curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer $1" \
                 -H "Accept: application/json" \
                 "https://ghcr.io/v2/$REGISTRY_REPO/tags/list?n=1" 2>/dev/null
          }

          # ghcr.io rejects a bare GitHub token as a bearer credential (403),
          # so exchange it for a repository pull token. Fall back to the
          # base64 form ghcr.io also accepts.
          echo "Authenticating to ghcr.io for $REGISTRY_REPO..."
          REGISTRY_TOKEN=""
          REGISTRY_AUTH_METHOD=""

          TOKEN_RESPONSE=$(curl -sf -u "x:$GH_TOKEN" \
            "https://ghcr.io/token?scope=repository:$REGISTRY_REPO:pull&service=ghcr.io" 2>/dev/null || true)
          AUTH_CANDIDATE=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.token // empty' 2>/dev/null || true)
          if [ -n "$AUTH_CANDIDATE" ] && [ "$(registry_probe "$AUTH_CANDIDATE")" = "200" ]; then
            REGISTRY_TOKEN="$AUTH_CANDIDATE"
            REGISTRY_AUTH_METHOD="exchanged pull token"
          else
            AUTH_CANDIDATE=$(printf '%s' "$GH_TOKEN" | base64 | tr -d '\n')
            if [ "$(registry_probe "$AUTH_CANDIDATE")" = "200" ]; then
              REGISTRY_TOKEN="$AUTH_CANDIDATE"
              REGISTRY_AUTH_METHOD="base64-encoded token"
            fi
          fi
          AUTH_CANDIDATE=""

          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "Error: could not authenticate to ghcr.io for $REGISTRY_REPO."
            echo "Nothing will be deleted. Without registry access this run cannot"
            echo "tell which untagged versions are per-architecture manifests that"
            echo "kept tags depend on."
            {
              echo "### ❌ Registry authentication failed"
              echo ""
              echo "Could not read manifests for \`$REGISTRY_REPO\` from ghcr.io, so the set"
              echo "of manifests referenced by kept images could not be determined."
              echo ""
              echo "**Nothing was deleted.** Pruning without that information is how multi-arch"
              echo "tags get hollowed out: the tag survives, its per-architecture children do"
              echo "not, and every pull afterwards fails with \`NotFound\`."
              echo ""
              echo "Check that \`GHCR_TOKEN\` carries \`read:packages\` for this package."
            } >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Registry auth: $REGISTRY_AUTH_METHOD"
          echo ""

          echo "Resolving manifests referenced by kept versions..."
          SCANNED_FILE="$WORK_DIR/scanned"
          PENDING_FILE="$WORK_DIR/pending"
          NEXT_FILE="$WORK_DIR/next"
          UNRESOLVED_FILE="$WORK_DIR/unresolved"
          : > "$REFERENCED_DIGESTS_FILE"
          : > "$SCANNED_FILE"
          : > "$UNRESOLVED_FILE"

          printf '%s' "$RESULTS" | jq -r '.to_keep[].name | select(startswith("sha256:"))' > "$PENDING_FILE"

          RESCUE_PASS=0
          while [ -s "$PENDING_FILE" ]; do
            RESCUE_PASS=$((RESCUE_PASS + 1))
            : > "$NEXT_FILE"
            while IFS= read -r digest; do
              [ -z "$digest" ] && continue
              if grep -qxF -- "$digest" "$SCANNED_FILE"; then
                continue
              fi
              printf '%s\n' "$digest" >> "$SCANNED_FILE"
              if MANIFEST=$(registry_get "$digest"); then
                # .manifests covers per-arch children plus attestation/SBOM
                # entries; .subject covers referrers-style attachments.
                printf '%s' "$MANIFEST" \
                  | jq -r '[(.manifests[]?.digest // empty), (.subject.digest // empty)] | .[]' 2>/dev/null \
                  | grep '^sha256:' >> "$NEXT_FILE" || true
              else
                printf '%s\n' "$digest" >> "$UNRESOLVED_FILE"
              fi
            done < "$PENDING_FILE"
            sort -u "$NEXT_FILE" -o "$NEXT_FILE"
            cat "$NEXT_FILE" >> "$REFERENCED_DIGESTS_FILE"
            # A referenced manifest may itself be an index, and anything
            # rescued below becomes a survivor whose own references matter.
            # Already-scanned digests are skipped, so this terminates.
            cp "$NEXT_FILE" "$PENDING_FILE"
          done

          # An unresolvable digest that is still a live package version is a
          # survivor whose dependencies are unknown - that is the fail-closed
          # case. An unresolvable digest that is no longer a version at all is
          # a dangling reference: damage a previous run already did, which is
          # reported below but cannot be made worse by this one.
          BLOCKING_UNRESOLVED=""
          DANGLING_REFS=""
          if [ -s "$UNRESOLVED_FILE" ]; then
            sort -u "$UNRESOLVED_FILE" -o "$UNRESOLVED_FILE"
            BLOCKING_UNRESOLVED=$(printf '%s' "$VERSIONS_JSON" | jq -r --rawfile unresolved "$UNRESOLVED_FILE" '
              ($unresolved | split("\n") | map(select(. != "")) | map({(.): true}) | add // {}) as $u |
              [.[] | select($u[.name] == true) | .name] | .[]
            ')
            DANGLING_REFS=$(printf '%s' "$VERSIONS_JSON" | jq -r --rawfile unresolved "$UNRESOLVED_FILE" '
              ([.[] | .name] | map({(.): true}) | add // {}) as $known |
              ($unresolved | split("\n") | map(select(. != ""))) | map(select($known[.] != true)) | .[]
            ')
          fi

          if [ -n "$BLOCKING_UNRESOLVED" ]; then
            BLOCKING_COUNT=$(printf '%s\n' "$BLOCKING_UNRESOLVED" | grep -c . || true)
            echo "Error: $BLOCKING_COUNT kept version(s) could not be resolved from the registry:"
            printf '%s\n' "$BLOCKING_UNRESOLVED" | sed 's/^/  /'
            echo ""
            echo "Nothing will be deleted. These versions survive this run, so anything"
            echo "they reference must survive too - and that reference set is unknown."
            {
              echo "### ❌ Kept manifests could not be resolved"
              echo ""
              echo "$BLOCKING_COUNT version(s) that this run would keep could not be read back"
              echo "from ghcr.io, so the manifests they depend on are unknown."
              echo ""
              echo "**Nothing was deleted.** Deleting an unknown dependency is what breaks"
              echo "multi-arch tags."
              echo ""
              echo '```'
              printf '%s\n' "$BLOCKING_UNRESOLVED"
              echo '```'
            } >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          REFERENCED_COUNT=0
          RESCUED_COUNT=0
          if [ -s "$REFERENCED_DIGESTS_FILE" ]; then
            sort -u "$REFERENCED_DIGESTS_FILE" -o "$REFERENCED_DIGESTS_FILE"
            REFERENCED_JSON=$(jq -R . < "$REFERENCED_DIGESTS_FILE" | jq -s .)
            REFERENCED_COUNT=$(printf '%s' "$REFERENCED_JSON" | jq 'length')
            echo "Kept versions reference $REFERENCED_COUNT manifest(s) (resolved in $RESCUE_PASS pass(es))"

            RESULTS=$(printf '%s' "$RESULTS" | jq --argjson referenced "$REFERENCED_JSON" '
              ($referenced | map({(.): true}) | add // {}) as $ref_set |
              (.to_delete | map(select($ref_set[.name] == true) | . + {reason: "referenced-by-kept-manifest"})) as $rescued |
              .to_delete = (.to_delete | map(select($ref_set[.name] != true))) |
              .to_keep += $rescued |
              reduce $rescued[] as $r (.; .kept_counts[$r.group] = ((.kept_counts[$r.group] // 0) + 1)) |
              .kept = ([.kept_counts[]] | add) |
              .rescued = ($rescued | length)
            ')
            RESCUED_COUNT=$(printf '%s' "$RESULTS" | jq '.rescued')
            echo "Rescued $RESCUED_COUNT version(s) from deletion as referenced children"
          else
            REFERENCED_JSON='[]'
            echo "No kept version references another manifest"
          fi

          # Belt and braces: the deletion list must not intersect the
          # referenced set. The rescue above already guarantees this; the
          # assertion is here so that a future edit which breaks it fails the
          # run instead of quietly hollowing out the registry again.
          LEAKED=$(printf '%s' "$RESULTS" | jq -r --argjson referenced "$REFERENCED_JSON" '
            ($referenced | map({(.): true}) | add // {}) as $ref_set |
            [.to_delete[] | select($ref_set[.name] == true) | .name] | .[]
          ')
          if [ -n "$LEAKED" ]; then
            echo "Error: deletion list still contains manifests referenced by kept images:"
            printf '%s\n' "$LEAKED" | sed 's/^/  /'
            {
              echo "### ❌ Internal check failed"
              echo ""
              echo "The deletion list still contained manifests referenced by kept images."
              echo "**Nothing was deleted.** This is a bug in the lifecycle workflow."
            } >> "$SUMMARY_FILE"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$DANGLING_REFS" ]; then
            DANGLING_COUNT=$(printf '%s\n' "$DANGLING_REFS" | grep -c . || true)
            echo "Warning: $DANGLING_COUNT manifest(s) referenced by kept images are already"
            echo "missing from the registry. Tags depending on them resolve but cannot be"
            echo "pulled, and only a rebuild restores them."
            printf '%s\n' "$DANGLING_REFS" | sed 's/^/  /'
            echo ""
            {
              echo "### ⚠️ Pre-existing broken references ($DANGLING_COUNT)"
              echo ""
              echo "Manifests referenced by kept images are already gone from the registry."
              echo "Tags depending on them still resolve but cannot be pulled. This damage"
              echo "predates this run and only a rebuild and re-push restores those tags."
              echo ""
              echo '```'
              printf '%s\n' "$DANGLING_REFS"
              echo '```'
              echo ""
            } >> "$SUMMARY_FILE"
          fi
          echo ""

          # Extract counts and lists
          KEPT_COUNT=$(echo "$RESULTS" | jq '.kept')
          PROTECTED_COUNT=$(echo "$RESULTS" | jq '.protected')
          KEPT_COUNTS=$(echo "$RESULTS" | jq '.kept_counts')
          TO_DELETE=$(echo "$RESULTS" | jq '.to_delete')
          TO_DELETE_COUNT=$(echo "$TO_DELETE" | jq 'length')
          TO_KEEP=$(echo "$RESULTS" | jq '.to_keep')

          # Show per-group counts if using tag prefixes
          if [ -n "$TAG_PREFIXES" ]; then
            echo "=== Per-Group Version Counts ==="
            echo "$KEPT_COUNTS" | jq -r 'to_entries[] | "  \(.key): \(.value) kept"'
            echo ""

            {
              echo "### Per-Group Counts"
              echo ""
              echo "| Group | Kept |"
              echo "|-------|------|"
              echo "$KEPT_COUNTS" | jq -r 'to_entries[] | "| \(.key) | \(.value) |"'
              echo ""
            } >> "$SUMMARY_FILE"
          fi

          echo "=== Versions to Keep ($((KEPT_COUNT + PROTECTED_COUNT))) ==="
          echo "$TO_KEEP" | jq -r '.[] | "  \(.name) [\(.tags | join(", ") | if . == "" then "<untagged>" else . end)] - \(.reason)"'
          echo ""

          # Add kept versions to summary
          {
            echo "### ✅ Versions Kept ($((KEPT_COUNT + PROTECTED_COUNT)))"
            echo ""
            if [ "$((KEPT_COUNT + PROTECTED_COUNT))" -gt 0 ]; then
              echo "| Version | Tags | Reason |"
              echo "|---------|------|--------|"
              echo "$TO_KEEP" | jq -r '.[] | "| \(.name) | \(.tags | join(", ") | if . == "" then "*untagged*" else . end) | \(.reason) |"'
            else
              echo "*No versions kept*"
            fi
            echo ""
          } >> "$SUMMARY_FILE"

          if [ "$TO_DELETE_COUNT" -eq 0 ]; then
            echo "=== No versions eligible for deletion ==="
            echo "deleted-count=0" >> "$GITHUB_OUTPUT"
            echo "kept-count=$((KEPT_COUNT + PROTECTED_COUNT))" >> "$GITHUB_OUTPUT"
            echo "dry-run-would-delete=0" >> "$GITHUB_OUTPUT"

            {
              echo "### 🗑️ Versions Deleted (0)"
              echo ""
              echo "*No versions eligible for deletion*"
            } >> "$SUMMARY_FILE"

            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "=== Versions to Delete ($TO_DELETE_COUNT) ==="
          echo "$TO_DELETE" | jq -r '.[] | "  \(.name) [\(.tags | join(", ") | if . == "" then "<untagged>" else . end)] created \(.created_at) (group: \(.group))"'
          echo ""

          DELETED=0
          FAILED=0
          FAILED_VERSIONS=""

          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN - No versions will be deleted ==="
            echo "deleted-count=0" >> "$GITHUB_OUTPUT"
            echo "kept-count=$((KEPT_COUNT + PROTECTED_COUNT))" >> "$GITHUB_OUTPUT"
            echo "dry-run-would-delete=$TO_DELETE_COUNT" >> "$GITHUB_OUTPUT"

            {
              echo "### 🔍 Versions That Would Be Deleted ($TO_DELETE_COUNT) - DRY RUN"
              echo ""
              echo "| Version | Tags | Created | Group |"
              echo "|---------|------|---------|-------|"
              echo "$TO_DELETE" | jq -r '.[] | "| \(.name) | \(.tags | join(", ") | if . == "" then "*untagged*" else . end) | \(.created_at) | \(.group) |"'
            } >> "$SUMMARY_FILE"
          else
            echo "=== Deleting versions ==="
            DELETED_VERSIONS=""
            DELETE_COUNT=0

            for id in $(echo "$TO_DELETE" | jq -r '.[].id'); do
              VERSION_INFO=$(echo "$TO_DELETE" | jq -r ".[] | select(.id == $id)")
              VERSION_NAME=$(echo "$VERSION_INFO" | jq -r '.name')
              VERSION_TAGS=$(echo "$VERSION_INFO" | jq -r '.tags | join(", ") | if . == "" then "*untagged*" else . end')
              VERSION_CREATED=$(echo "$VERSION_INFO" | jq -r '.created_at')
              VERSION_GROUP=$(echo "$VERSION_INFO" | jq -r '.group')

              printf "Deleting version %s (id: %s)... " "$VERSION_NAME" "$id"

              # Retry logic for rate limiting
              MAX_RETRIES=3
              RETRY_DELAY=5
              SUCCESS=false

              for attempt in $(seq 1 $MAX_RETRIES); do
                RESPONSE=$(gh api --method DELETE "$API_PATH/$id" 2>&1) && {
                  SUCCESS=true
                  break
                }

                # Check if rate limited
                if echo "$RESPONSE" | grep -q "429\|throttled"; then
                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                    echo "rate limited, waiting ${RETRY_DELAY}s (attempt $attempt/$MAX_RETRIES)..."
                    sleep $RETRY_DELAY
                    RETRY_DELAY=$((RETRY_DELAY * 2))  # Exponential backoff
                  fi
                else
                  # Not a rate limit error, don't retry
                  break
                fi
              done

              if [ "$SUCCESS" = true ]; then
                echo "OK"
                DELETED=$((DELETED + 1))
                printf -v ROW '| %s | %s | %s | %s |\n' "$VERSION_NAME" "$VERSION_TAGS" "$VERSION_CREATED" "$VERSION_GROUP"
                DELETED_VERSIONS="${DELETED_VERSIONS}${ROW}"
              else
                echo "FAILED"
                FAILED=$((FAILED + 1))
                printf -v ROW '| %s | %s | %s | %s |\n' "$VERSION_NAME" "$VERSION_TAGS" "$VERSION_CREATED" "$VERSION_GROUP"
                FAILED_VERSIONS="${FAILED_VERSIONS}${ROW}"
              fi

              # Rate limit prevention: pause every 10 deletions
              DELETE_COUNT=$((DELETE_COUNT + 1))
              if [ $((DELETE_COUNT % 10)) -eq 0 ]; then
                echo "  (pausing 2s to avoid rate limits...)"
                sleep 2
              fi
            done

            echo ""

            # Verify the run's own work. This class of corruption is silent by
            # construction - the tag keeps resolving, only the pull fails - so
            # nothing catches it until a deployment does. Re-resolve every
            # surviving tag and confirm each manifest it references is still
            # present.
            echo "=== Verifying surviving tags ==="
            : >| "$WORK_DIR/broken_tags"
            VERIFIED_TAGS=0
            while IFS="$(printf '\t')" read -r vdigest vtags; do
              [ -z "$vdigest" ] && continue
              VERIFIED_TAGS=$((VERIFIED_TAGS + 1))
              if ! VMANIFEST=$(registry_get "$vdigest"); then
                printf '%s\t%s\t%s\n' "$vtags" "$vdigest" "index unreadable" >> "$WORK_DIR/broken_tags"
                continue
              fi
              while IFS= read -r vchild; do
                [ -z "$vchild" ] && continue
                if ! registry_exists "$vchild"; then
                  printf '%s\t%s\t%s\n' "$vtags" "$vdigest" "missing child $vchild" >> "$WORK_DIR/broken_tags"
                fi
              done < <(printf '%s' "$VMANIFEST" | jq -r '.manifests[]?.digest // empty')
            done < <(printf '%s' "$RESULTS" | jq -r '.to_keep[] | select(.tags | length > 0) | "\(.name)\t\(.tags | join(","))"')

            # Damage this run caused is a hard failure. Damage that was
            # already there (recorded above, before anything was deleted) is
            # reported but must not fail every future run, since only a
            # rebuild can restore those manifests.
            : >| "$WORK_DIR/broken_new"
            : >| "$WORK_DIR/broken_old"
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              rowdigest=${row##*missing child }
              if [ "$rowdigest" != "$row" ] && grep -qxF -- "$rowdigest" "$UNRESOLVED_FILE"; then
                printf '%s\n' "$row" >> "$WORK_DIR/broken_old"
              else
                printf '%s\n' "$row" >> "$WORK_DIR/broken_new"
              fi
            done < "$WORK_DIR/broken_tags"

            BROKEN_NEW_COUNT=$(grep -c . "$WORK_DIR/broken_new" || true)
            BROKEN_OLD_COUNT=$(grep -c . "$WORK_DIR/broken_old" || true)
            echo "Checked $VERIFIED_TAGS surviving tagged image(s): $BROKEN_NEW_COUNT new problem(s), $BROKEN_OLD_COUNT pre-existing"

            if [ "$BROKEN_OLD_COUNT" -gt 0 ]; then
              {
                echo "### ⚠️ Tags broken before this run ($BROKEN_OLD_COUNT)"
                echo ""
                echo "These tags already referenced missing manifests when the run started."
                echo "Only a rebuild and re-push restores them."
                echo ""
                echo "| Tags | Version | Problem |"
                echo "|------|---------|---------|"
                awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' "$WORK_DIR/broken_old"
                echo ""
              } >> "$SUMMARY_FILE"
            fi

            if [ "$BROKEN_NEW_COUNT" -gt 0 ]; then
              echo ""
              echo "Error: this run left $BROKEN_NEW_COUNT surviving tag reference(s) unpullable:"
              sed 's/^/  /' "$WORK_DIR/broken_new"
              {
                echo "### ❌ This run broke surviving tags ($BROKEN_NEW_COUNT)"
                echo ""
                echo "After cleanup these kept tags reference manifests that are no longer in"
                echo "the registry. They still resolve, but every pull of them fails."
                echo ""
                echo "| Tags | Version | Problem |"
                echo "|------|---------|---------|"
                awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' "$WORK_DIR/broken_new"
                echo ""
              } >> "$SUMMARY_FILE"
              cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo ""

            echo "=== Summary ==="
            echo "Protected: $PROTECTED_COUNT"
            echo "Kept: $KEPT_COUNT"
            echo "Deleted: $DELETED"
            if [ "$FAILED" -gt 0 ]; then
              echo "Failed to delete: $FAILED"
            fi

            echo "deleted-count=$DELETED" >> "$GITHUB_OUTPUT"
            echo "kept-count=$((KEPT_COUNT + PROTECTED_COUNT + FAILED))" >> "$GITHUB_OUTPUT"
            echo "dry-run-would-delete=0" >> "$GITHUB_OUTPUT"

            # Add deleted versions to summary
            {
              echo "### 🗑️ Versions Deleted ($DELETED)"
              echo ""
              if [ "$DELETED" -gt 0 ]; then
                echo "| Version | Tags | Created | Group |"
                echo "|---------|------|---------|-------|"
                printf '%s' "$DELETED_VERSIONS"
              else
                echo "*No versions were deleted*"
              fi
              echo ""

              if [ "$FAILED" -gt 0 ]; then
                echo "### ⚠️ Failed to Delete ($FAILED)"
                echo ""
                echo "| Version | Tags | Created | Group |"
                echo "|---------|------|---------|-------|"
                printf '%s' "$FAILED_VERSIONS"
                echo ""
              fi
            } >> "$SUMMARY_FILE"

            # Fail the workflow if any deletions failed
            if [ "$FAILED" -gt 0 ]; then
              echo "### ⚠️ Workflow completed with errors" >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              echo "Failed to delete $FAILED version(s). This may indicate rate limiting or permission issues." >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              echo "**Tip:** If rate limited, re-run the workflow to continue cleanup. Successfully deleted versions won't be attempted again." >> "$SUMMARY_FILE"
              cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
